<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reena AI - Personal Assistant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
  body {
    background: radial-gradient(circle at top, #36103a, #13071d 55%, #08040c 100%);
    color: #fff; min-height: 100vh; display: flex; flex-direction: column;
    justify-content: space-between; align-items: center; padding: 16px; gap: 12px;
    transition: background 0.6s ease;
  }
  body.mood-romantic {
    background: radial-gradient(circle at top, #4d1038, #1c071b 55%, #09030a 100%);
  }
  body.mood-caring {
    background: radial-gradient(circle at top, #1b2849, #0e1329 55%, #060812 100%);
  }
  body.mood-shy {
    background: radial-gradient(circle at top, #461742, #1d0924 55%, #09030e 100%);
  }

  .header { text-align: center; margin-top: 2px; }
  .header h1 { font-size: 24px; color: #ff79ce; letter-spacing: 1px; text-shadow: 0 0 18px rgba(255, 121, 206, 0.35); }
  .header p { font-size: 12.5px; color: #e2b6d6; margin-top: 2px; }

  .top-badges { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .mood-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 13px; border-radius: 999px; font-size: 12px;
    background: rgba(255, 255, 255, 0.09);
    border: 1px solid rgba(255, 130, 210, 0.35);
    color: #ffd6f0; backdrop-filter: blur(8px);
  }

  .avatar-container {
    position: relative; width: 175px; height: 175px; border-radius: 50%;
    display: flex; justify-content: center; align-items: center;
    box-shadow: 0 0 38px rgba(255, 110, 199, 0.45);
    border: 3px solid #ff79ce; overflow: hidden;
    transition: transform 0.35s ease, box-shadow 0.4s ease, border-color 0.4s ease;
  }
  .avatar-container.speaking {
    animation: pulse 0.95s infinite alternate;
    box-shadow: 0 0 68px rgba(255, 85, 180, 0.9);
  }
  .avatar-container.listening {
    border-color: #7cf7ff;
    box-shadow: 0 0 55px rgba(124, 247, 255, 0.65);
  }
  .avatar-container img { width: 100%; height: 100%; object-fit: cover; }

  @keyframes pulse {
    from { transform: scale(1); }
    to { transform: scale(1.06); }
  }

  .chat-box {
    width: 100%; max-width: 430px; background: rgba(255,255,255,0.07);
    backdrop-filter: blur(12px); border-radius: 18px; padding: 14px 16px;
    min-height: 86px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px;
    text-align: center; border: 1px solid rgba(255,110,199,0.3);
  }
  #replyText { font-size: 15.5px; color: #fff0fa; line-height: 1.5; word-break: break-word; }

  .sub-bar {
    width: 100%; max-width: 430px; display: flex; flex-wrap: wrap;
    justify-content: space-between; align-items: center; gap: 6px;
  }
  .toggle-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 10px; border-radius: 11px; font-size: 11.5px;
    background: rgba(255,255,255,0.08); color: #f5d8ec;
    border: 1px solid rgba(255,255,255,0.14); cursor: pointer;
  }
  .toggle-chip.active {
    background: rgba(255, 77, 166, 0.25);
    border-color: #ff79ce; color: #fff;
  }
  .action-group { display: flex; gap: 6px; }
  .mini-btn {
    padding: 6px 10px; border-radius: 11px; font-size: 11.5px;
    background: rgba(255,255,255,0.12); color: #fff;
    border: 1px solid rgba(255,255,255,0.15); cursor: pointer;
  }

  .controls { width: 100%; max-width: 430px; display: flex; gap: 10px; }
  input {
    flex: 1; padding: 13px 16px; border-radius: 25px; border: none; outline: none;
    background: rgba(255,255,255,0.12); color: #fff; font-size: 15px;
  }
  .round-btn {
    width: 50px; height: 50px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, #ff4da6, #a64dff); color: #fff;
    font-size: 19px; cursor: pointer; box-shadow: 0 4px 15px rgba(255,77,166,0.4);
  }
  .round-btn.mic-on {
    background: linear-gradient(135deg, #00d2ff, #7b2cbf);
    box-shadow: 0 0 22px rgba(0, 210, 255, 0.7);
  }

  .drawer {
    width: 100%; max-width: 430px; background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 14px;
    padding: 12px; display: none; flex-direction: column; gap: 8px;
  }
  .drawer.open { display: flex; }
  .drawer label { font-size: 11px; color: #d8a7ca; }
  .drawer input { padding: 8px 12px; font-size: 12px; border-radius: 10px; width: 100%; }
  .drawer-row { display: flex; gap: 8px; }
  .save-btn {
    padding: 9px 14px; border-radius: 10px; font-size: 12px; border: none;
    background: linear-gradient(135deg, #ff4da6, #a64dff); color: #fff; cursor: pointer;
  }
  .notes-list {
    max-height: 120px; overflow-y: auto; font-size: 12px; color: #ffe6f5;
    display: flex; flex-direction: column; gap: 5px;
  }
  .note-item {
    background: rgba(255,255,255,0.07); padding: 6px 10px; border-radius: 8px;
    display: flex; justify-content: space-between; align-items: center;
  }
</style>
</head>
<body class="mood-romantic">

  <div class="header">
    <h1>✨ Reena AI ✨</h1>
    <p>Always here for you ❤️</p>
  </div>

  <div class="top-badges">
    <div class="mood-pill" id="moodBadge">💖 Romantic & Warm</div>
    <div class="mood-pill" id="engineBadge">⚡ Smart Dual AI</div>
  </div>

  <div class="avatar-container" id="avatarBox">

  </div>

  <div class="chat-box">
    <p id="replyText">"Hii jaan... main Reena hoon. Batao aaj main tumhare liye kya kar sakti hoon?"</p>
  </div>

  <div class="sub-bar">
    <button type="button" class="toggle-chip active" id="autoMicBtn" onclick="toggleAutoMic()">🎙️ Auto Mic: ON</button>
    <button type="button" class="toggle-chip active" id="soulSoundBtn" onclick="toggleSoulSound()">🎶 Soul: ON</button>
    <div class="action-group">
      <button type="button" class="mini-btn" onclick="retryLastMessage()">🔄 Retry</button>
      <button type="button" class="mini-btn" onclick="toggleDrawer('notesDrawer')">📝 Notes</button>
      <button type="button" class="mini-btn" onclick="toggleDrawer('settingsDrawer')">⚙️ Keys</button>
    </div>
  </div>

  <!-- Notes & Reminders Drawer -->
  <div class="drawer" id="notesDrawer">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <label>📝 Saved Notes & Reminders</label>
      <button type="button" class="mini-btn" onclick="clearNotes()">Clear All</button>
    </div>
    <div class="notes-list" id="notesList"></div>
  </div>

  <!-- API Keys & Voice Settings Drawer -->
  <div class="drawer" id="settingsDrawer">
    <label>1. Google AI Studio Key (Primary)</label>
    <input type="text" id="geminiKeyInput" placeholder="Gemini API Key (AIza...)">
    <label>2. OpenRouter API Key (503 Backup — Free models support)</label>
    <input type="text" id="openRouterKeyInput" placeholder="OpenRouter Key (sk-or-...)">
    <label>3. ElevenLabs API Key & Voice ID (Optional realistic voice)</label>
    <div class="drawer-row">
      <input type="text" id="elevenKeyInput" placeholder="ElevenLabs Key">
      <input type="text" id="elevenVoiceInput" placeholder="Voice ID (e.g. 21m00Tcm4TlvDq8ikWAM)">
    </div>
    <div class="drawer-row" style="justify-content:space-between; margin-top:4px;">
      <button type="button" class="mini-btn" onclick="clearChat()">🧹 Reset Chat</button>
      <button type="button" class="save-btn" onclick="saveSettings()">✅ Save Settings</button>
    </div>
  </div>

  <div class="controls">
    <input type="text" id="userInput" placeholder="Reena se kuch kaho..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button type="button" class="round-btn" id="micBtn" onclick="startVoice(true)" title="Bolkar poochein">🎤</button>
    <button type="button" class="round-btn" onclick="sendMessage()" title="Bhejein">➤</button>
  </div>

    }
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume().catch(() => {});
    }
    return audioCtx;
  }

      const gain = ctx.createGain();
      osc.type = idx % 2 === 0 ? "sine" : "triangle";

      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + idx * 0.08);
      osc.stop(ctx.currentTime + idx * 0.08 + 1.35);
    });
  }
