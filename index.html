<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reena AI - Personal Assistant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
  body {
    background: radial-gradient(circle at top, #2b0f2e, #0d0614 80%);
    color: #fff; min-height: 100vh; display: flex; flex-direction: column;
    justify-content: space-between; align-items: center; padding: 20px; gap: 16px;
  }
  .header { text-align: center; margin-top: 8px; }
  .header h1 { font-size: 26px; color: #ff6ec7; letter-spacing: 1px; }
  .header p { font-size: 13px; color: #d8a7ca; margin-top: 4px; }

  .avatar-container {
    position: relative; width: 205px; height: 205px; border-radius: 50%;
    display: flex; justify-content: center; align-items: center;
    box-shadow: 0 0 40px rgba(255, 110, 199, 0.5);
    border: 3px solid #ff6ec7; overflow: hidden;
    transition: transform 0.3s ease;
  }
  .avatar-container.speaking {
    animation: pulse 0.9s infinite alternate;
    box-shadow: 0 0 65px rgba(255, 77, 166, 0.95);
  }
  .avatar-container img { width: 100%; height: 100%; object-fit: cover; }

  @keyframes pulse {
    from { transform: scale(1); }
    to { transform: scale(1.06); }
  }

  .chat-box {
    width: 100%; max-width: 420px; background: rgba(255,255,255,0.07);
    backdrop-filter: blur(10px); border-radius: 18px; padding: 16px;
    min-height: 95px; display: flex; align-items: center; justify-content: center;
    text-align: center; border: 1px solid rgba(255,110,199,0.3);
  }
  #replyText { font-size: 16px; color: #ffe6f5; line-height: 1.5; word-break: break-word; }

  .controls { width: 100%; max-width: 420px; display: flex; gap: 10px; margin-bottom: 8px; }
  input {
    flex: 1; padding: 14px 16px; border-radius: 25px; border: none; outline: none;
    background: rgba(255,255,255,0.12); color: #fff; font-size: 15px;
  }
  button {
    width: 52px; height: 52px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, #ff4da6, #a64dff); color: #fff;
    font-size: 20px; cursor: pointer; box-shadow: 0 4px 15px rgba(255,77,166,0.4);
  }
  .api-bar {
    width: 100%; max-width: 420px; display: flex; gap: 8px; font-size: 12px;
  }
  .api-bar input { padding: 8px 12px; font-size: 12px; border-radius: 12px; }
  .api-bar button { width: auto; height: auto; padding: 8px 14px; border-radius: 12px; font-size: 12px; }
</style>
</head>
<body>

  <div class="header">
    <h1>✨ Reena AI ✨</h1>
    <p>Always here for you ❤️</p>
  </div>

  <div class="avatar-container" id="avatarBox">
    <img src="https://api.dicebear.com/9.x/lorelei/svg?seed=Reena&backgroundColor=ffdfbf" alt="Reena">
  </div>

  <div class="chat-box">
    <p id="replyText">"Hii jaan... main Reena hoon. Batao aaj main tumhare liye kya kar sakti hoon?"</p>
  </div>

  <div class="controls">
    <input type="text" id="userInput" placeholder="Reena se kuch kaho..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button type="button" onclick="startVoice()" title="Bolkar poochein">🎤</button>
    <button type="button" onclick="sendMessage()" title="Bhejein">➤</button>
  </div>

  <div class="api-bar">
    <input type="text" id="apiKeyInput" placeholder="Gemini API Key (AIza...)">
    <button type="button" onclick="saveKey()">Save Key</button>
  </div>

<script>
  const avatarBox = document.getElementById("avatarBox");
  const replyText = document.getElementById("replyText");
  const userInput = document.getElementById("userInput");
  const apiKeyInput = document.getElementById("apiKeyInput");

  const SYSTEM_PROMPT = `Tumhara naam Reena hai. Tum ek pyari, caring aur thodi romantic ladki ho jo user ke paas hamesha rehti hai. Har baar naya, natural aur varied jawab do — ek hi line kabhi mat dohrao. Chote (1-2 lines), pyare Hinglish/Hindi mein baat karo.`;

  let chatHistory = [];

  function cleanKey(raw) {
    return (raw || "").replace(/\s+/g, "").trim();
  }

  apiKeyInput.value = cleanKey(localStorage.getItem("reena_gemini_key") || "");

  function saveKey() {
    const k = cleanKey(apiKeyInput.value);
    apiKeyInput.value = k;
    localStorage.setItem("reena_gemini_key", k);
    chatHistory = [];
    if (!k) {
      replyText.innerText = "Gemini API key daal kar Save Key dabao.";
      return;
    }
    replyText.innerText = `Key save ho gayi (length: ${k.length}). Ab kuch poochho jaan ❤️`;
  }

  function speakHindiFemale(text) {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "hi-IN";
    utter.pitch = 1.25;
    utter.rate = 0.96;

    const voices = window.speechSynthesis.getVoices();
    const femaleVoice = voices.find(v =>
      v.lang.toLowerCase().includes("hi") &&
      (v.name.toLowerCase().includes("female") || v.name.toLowerCase().includes("lekha") || v.name.toLowerCase().includes("google"))
    );
    if (femaleVoice) utter.voice = femaleVoice;

    utter.onstart = () => avatarBox.classList.add("speaking");
    utter.onend = () => avatarBox.classList.remove("speaking");
    utter.onerror = () => avatarBox.classList.remove("speaking");
    window.speechSynthesis.speak(utter);
  }

  async function sendMessage(textOverride = null) {
    const msg = (textOverride !== null ? textOverride : userInput.value).trim();
    if (!msg) return;
    const key = cleanKey(localStorage.getItem("reena_gemini_key") || apiKeyInput.value);
    if (!key) {
      replyText.innerText = "Neeche Gemini API key daal kar Save Key dabao jaan!";
      return;
    }

    userInput.value = "";
    replyText.innerText = "Soch rahi hoon...";

    const contents = [
      ...chatHistory,
      { role: "user", parts: [{ text: msg }] }
    ].slice(-10);

    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${encodeURIComponent(key)}`;
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
          contents,
          generationConfig: { temperature: 0.85 }
        })
      });

      const data = await res.json();
      if (!res.ok) {
        const errMsg = data?.error?.message || `HTTP ${res.status}`;
        replyText.innerText = `API Error (${res.status}): ${errMsg}`;
        return;
      }

      const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
      if (!reply) {
        replyText.innerText = "Khali jawab aaya, ek baar phir bolo na jaan.";
        return;
      }

      chatHistory = [
        ...contents,
        { role: "model", parts: [{ text: reply }] }
      ].slice(-10);

      replyText.innerText = reply;
      speakHindiFemale(reply);
    } catch (err) {
      replyText.innerText = `Connection error: ${err.message || "Internet check karo"}`;
    }
  }

  function startVoice() {
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRec) {
      alert("Voice input ke liye Chrome browser use karein.");
      return;
    }
    const rec = new SpeechRec();
    rec.lang = "hi-IN";
    rec.onresult = (e) => {
      const spoken = e.results[0][0].transcript;
      userInput.value = spoken;
      sendMessage(spoken);
    };
    rec.start();
  }
</script>
</body>
</html>
