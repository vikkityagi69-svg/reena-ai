<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reena AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
  body {
    background: radial-gradient(circle at top, #3b103d, #12061c 70%, #07030b 100%);
    color: #fff; min-height: 100vh; display: flex; flex-direction: column;
    justify-content: space-between; align-items: center; padding: 16px; gap: 12px;
  }
  body.mood-caring { background: radial-gradient(circle at top, #1b2a4a, #0d1226 75%); }
  body.mood-shy { background: radial-gradient(circle at top, #4b1544, #1a0721 75%); }

  .header { text-align: center; }
  .header h1 { font-size: 24px; color: #ff79ce; }
  .header p { font-size: 12px; color: #e0b5d4; margin-top: 2px; }

  .badges { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .pill {
    padding: 5px 12px; border-radius: 999px; font-size: 12px;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,121,206,0.35);
  }

  .avatar {
    width: 175px; height: 175px; border-radius: 50%; overflow: hidden;
    border: 3px solid #ff79ce; box-shadow: 0 0 35px rgba(255,121,206,0.45);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  .chat-box {
    width: 100%; max-width: 430px; min-height: 90px; padding: 14px;
    border-radius: 16px; background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,121,206,0.3); text-align: center;
    display: flex; align-items: center; justify-content: center;
  }
  #replyText { font-size: 15px; line-height: 1.5; color: #fff0fa; }

  .bar { width: 100%; max-width: 430px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: space-between; }
  .btn-chip {
    padding: 7px 11px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.12); color: #fff; font-size: 12px; cursor: pointer;
  }
  .btn-chip.on { background: rgba(255,77,166,0.3); border-color: #ff79ce; }

  .panel {
    width: 100%; max-width: 430px; display: none; flex-direction: column; gap: 8px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16);
    border-radius: 14px; padding: 12px;
  }
  .panel.show { display: flex; }
  .panel input {
    width: 100%; padding: 9px 12px; border-radius: 10px; border: none;
    background: rgba(255,255,255,0.15); color: #fff; font-size: 13px;
  }
  .save-btn {
    padding: 9px 14px; border-radius: 10px; border: none; color: #fff; font-size: 13px;
    background: linear-gradient(135deg, #ff4da6, #a64dff); cursor: pointer;
  }

  .controls { width: 100%; max-width: 430px; display: flex; gap: 8px; }
  #msgInput {
    flex: 1; padding: 13px 15px; border-radius: 24px; border: none; outline: none;
    background: rgba(255,255,255,0.14); color: #fff; font-size: 15px;
  }
  .circle-btn {
    width: 48px; height: 48px; border-radius: 50%; border: none; color: #fff; font-size: 18px;
    background: linear-gradient(135deg, #ff4da6, #a64dff); cursor: pointer;
  }
</style>
</head>
<body>

  <div class="header">
    <h1>Reena AI</h1>
    <p>Always here for you</p>
  </div>

  <div class="badges">
    <div class="pill" id="moodTag">Romantic</div>
    <div class="pill" id="modelTag">Gemini + OpenRouter</div>
  </div>

  <div class="avatar">
    <img src="https://api.dicebear.com/9.x/lorelei/svg?seed=Reena&backgroundColor=ffdfbf" alt="Reena">
  </div>

  <div class="chat-box">
    <p id="replyText">Hii jaan... main Reena hoon. Pehle Keys mein apni key save karo aur kuch bolo.</p>
  </div>

  <div class="bar">
    <button type="button" class="btn-chip on" id="micToggle" onclick="toggleMic()">Auto Mic: ON</button>
    <button type="button" class="btn-chip on" id="soulToggle" onclick="toggleSoul()">Soul: ON</button>
    <button type="button" class="btn-chip" onclick="retryMsg()">Retry</button>
    <button type="button" class="btn-chip" onclick="openPanel('keysPanel')">Keys</button>
    <button type="button" class="btn-chip" onclick="openPanel('notesPanel')">Notes</button>
  </div>

  <div class="panel" id="keysPanel">
    <input type="text" id="gKey" placeholder="Gemini API Key (AIza...)">
    <input type="text" id="orKey" placeholder="OpenRouter API Key (sk-or-... optional)">
    <button type="button" class="save-btn" onclick="saveKeys()">Save Keys</button>
  </div>

  <div class="panel" id="notesPanel">
    <div id="notesBox" style="font-size:12px;">Koi note nahi hai.</div>
  </div>

  <div class="controls">
    <input type="text" id="msgInput" placeholder="Reena se kuch kaho...">
    <button type="button" class="circle-btn" onclick="listenVoice()">🎤</button>
    <button type="button" class="circle-btn" onclick="sendChat()">➤</button>
  </div>

<script>
  let history = [];
  let lastMsg = "";
  let autoMic = true;
  let soulOn = true;
  let audioCtx = null;

  document.getElementById("gKey").value = localStorage.getItem("r_gkey") || "";
  document.getElementById("orKey").value = localStorage.getItem("r_orkey") || "";

  document.getElementById("msgInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") sendChat();
  });

  function openPanel(id) {
    const p = document.getElementById(id);
    const show = !p.classList.contains("show");
    document.querySelectorAll(".panel").forEach(el => el.classList.remove("show"));
    if (show) {
      p.classList.add("show");
      if (id === "notesPanel") showNotes();
    }
  }

  function saveKeys() {
    const gk = document.getElementById("gKey").value.trim();
    const ok = document.getElementById("orKey").value.trim();
    localStorage.setItem("r_gkey", gk);
    localStorage.setItem("r_orkey", ok);
    history = [];
    document.getElementById("keysPanel").classList.remove("show");
    document.getElementById("replyText").innerText = "Keys save ho gayi jaan! Ab kuch likho ya bolo.";
    playChime();
  }

  function toggleMic() {
    autoMic = !autoMic;
    const b = document.getElementById("micToggle");
    b.innerText = "Auto Mic: " + (autoMic ? "ON" : "OFF");
    b.classList.toggle("on", autoMic);
  }

  function toggleSoul() {
    soulOn = !soulOn;
    const b = document.getElementById("soulToggle");
    b.innerText = "Soul: " + (soulOn ? "ON" : "OFF");
    b.classList.toggle("on", soulOn);
  }

  function playChime() {
    if (!soulOn) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = 329.63;
      gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.9);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.95);
    } catch (e) {}
  }

  function speak(text) {
    playChime();
    if ("speechSynthesis" in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "hi-IN";
      u.pitch = 1.25;
      u.onend = function() {
        if (autoMic) setTimeout(listenVoice, 400);
      };
      window.speechSynthesis.speak(u);
    }
  }

  function addNote(txt) {
    const arr = JSON.parse(localStorage.getItem("r_notes") || "[]");
    arr.unshift(txt);
    localStorage.setItem("r_notes", JSON.stringify(arr.slice(0, 20)));
  }

  function showNotes() {
    const arr = JSON.parse(localStorage.getItem("r_notes") || "[]");
    document.getElementById("notesBox").innerHTML = arr.length
      ? arr.map(n => "<div style='padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.1);'>" + n + "</div>").join("")
      : "Koi note nahi hai.";
  }

  function setMood(m) {
    document.body.classList.remove("mood-caring", "mood-shy");
    if (m === "caring") {
      document.body.classList.add("mood-caring");
      document.getElementById("moodTag").innerText = "Caring";
    } else if (m === "shy") {
      document.body.classList.add("mood-shy");
      document.getElementById("moodTag").innerText = "Shy";
    } else {
      document.getElementById("moodTag").innerText = "Romantic";
    }
  }

  async function callGemini(key, contents) {
    const sys = "Tum Reena ho — pyari, caring aur romantic assistant. Jawab ke shuru mein [romantic], [caring], ya [shy] likho. 1-2 choti lines mein naya Hinglish jawab do. Agar user note likhne ko kahe toh likho: NOTE: <text>";
    const models = ["gemini-flash-latest", "gemini-2.5-flash", "gemini-3.8-flash"];
    for (const m of models) {
      const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + m + ":generateContent?key=" + encodeURIComponent(key), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: sys }] },
          contents: contents,
          generationConfig: { temperature: 1.0 }
        })
      });
      const d = await r.json().catch(() => ({}));
      if (r.ok && d.candidates && d.candidates[0] && d.candidates[0].content) {
        const t = d.candidates[0].content.parts[0].text.trim();
        if (t) return { text: t, src: m };
      }
    }
    return null;
  }

  async function callOpenRouter(key, contents) {
    const msgs = [{ role: "system", content: "Tum Reena ho — pyari aur romantic assistant. Chota naya Hinglish jawab do." }];
    contents.forEach(c => msgs.push({ role: c.role === "model" ? "assistant" : "user", content: c.parts[0].text }));
    const r = await fetch("https://openrouter.ai/api/v1/chat/completions", {
      method: "POST",
      headers: { "Authorization": "Bearer " + key, "Content-Type": "application/json" },
      body: JSON.stringify({ model: "openrouter/free", messages: msgs, temperature: 1.0 })
    });
    const d = await r.json().catch(() => ({}));
    if (r.ok && d.choices && d.choices[0] && d.choices[0].message) {
      return { text: d.choices[0].message.content.trim(), src: "OpenRouter" };
    }
    return null;
  }

  async function sendChat(overrideText) {
    const input = document.getElementById("msgInput");
    const msg = (overrideText || input.value).trim();
    if (!msg) return;

    const gk = (localStorage.getItem("r_gkey") || "").trim();
    const ok = (localStorage.getItem("r_orkey") || "").trim();
    if (!gk && !ok) {
      openPanel("keysPanel");
      document.getElementById("replyText").innerText = "Pehle Gemini ya OpenRouter key daal kar Save Keys dabao.";
      return;
    }

    lastMsg = msg;
    input.value = "";
    document.getElementById("replyText").innerText = "Soch rahi hoon...";

    const contents = history.concat([{ role: "user", parts: [{ text: msg }] }]).slice(-8);

    try {
      let res = gk ? await callGemini(gk, contents) : null;
      if (!res && ok) res = await callOpenRouter(ok, contents);

      if (!res || !res.text) {
        const reason = gk
          ? "Gemini ne reply nahi diya (key/model/quota check karo)."
          : "Gemini key khali hai; Keys panel mein key daal kar Save Keys dabao.";
        document.getElementById("replyText").innerText = reason + " Retry dabao.";
        return;
      }


      let raw = res.text;
      let mood = "romantic";
      if (raw.toLowerCase().includes("[caring]")) mood = "caring";
      else if (raw.toLowerCase().includes("[shy]")) mood = "shy";
      raw = raw.replace(/\[(romantic|caring|shy)\]/gi, "").trim();

      if (raw.toUpperCase().startsWith("NOTE:")) {
        const noteTxt = raw.slice(5).trim();
        addNote(noteTxt);
        raw = "Note save kar liya jaan: " + noteTxt;
      }

      setMood(mood);
      document.getElementById("modelTag").innerText = res.src;
      history = contents.concat([{ role: "model", parts: [{ text: raw }] }]).slice(-8);
      document.getElementById("replyText").innerText = raw;
      speak(raw);
    } catch (e) {
      document.getElementById("replyText").innerText = "Error: " + e.message;
    }
  }

  function retryMsg() {
    if (lastMsg) sendChat(lastMsg);
  }

  function listenVoice() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return;
    try {
      const rec = new SR();
      rec.lang = "hi-IN";
      rec.onresult = function(e) {
        const spoken = e.results[0][0].transcript;
        document.getElementById("msgInput").value = spoken;
        sendChat(spoken);
      };
      rec.start();
    } catch (e) {}
  }
</script>
</body>
</html>
