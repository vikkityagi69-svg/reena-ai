<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reena AI - Personal Assistant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
  body {
    background: radial-gradient(circle at top, #2b0f2e, #0d0614 80%);
    color: #fff; min-height: 100vh; display: flex; flex-direction: column;
    justify-content: space-between; align-items: center; padding: 20px; gap: 16px;
  }
  .header { text-align: center; margin-top: 8px; }
  .header h1 { font-size: 26px; color: #ff6ec7; letter-spacing: 1px; }
  .header p { font-size: 13px; color: #d8a7ca; margin-top: 4px; }

  .avatar-container {
    position: relative; width: 205px; height: 205px; border-radius: 50%;
    display: flex; justify-content: center; align-items: center;
    box-shadow: 0 0 40px rgba(255, 110, 199, 0.5);
    border: 3px solid #ff6ec7; overflow: hidden;
    transition: transform 0.3s ease;
  }
  .avatar-container.speaking {
    animation: pulse 0.9s infinite alternate;
    box-shadow: 0 0 65px rgba(255, 77, 166, 0.95);
  }
  .avatar-container img { width: 100%; height: 100%; object-fit: cover; }

  @keyframes pulse {
    from { transform: scale(1); }
    to { transform: scale(1.06); }
  }

  .chat-box {
    width: 100%; max-width: 420px; background: rgba(255,255,255,0.07);
    backdrop-filter: blur(10px); border-radius: 18px; padding: 16px;
    min-height: 95px; display: flex; align-items: center; justify-content: center;
    text-align: center; border: 1px solid rgba(255,110,199,0.3);
  }
  #replyText { font-size: 16px; color: #ffe6f5; line-height: 1.5; word-break: break-word; }

  .controls { width: 100%; max-width: 420px; display: flex; gap: 10px; margin-bottom: 8px; }
  input {
    flex: 1; padding: 14px 16px; border-radius: 25px; border: none; outline: none;
    background: rgba(255,255,255,0.12); color: #fff; font-size: 15px;
  }
  button {
    width: 52px; height: 52px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, #ff4da6, #a64dff); color: #fff;
    font-size: 20px; cursor: pointer; box-shadow: 0 4px 15px rgba(255,77,166,0.4);
  }
  .api-bar {
    width: 100%; max-width: 420px; display: flex; gap: 8px; font-size: 12px;
  }
  .api-bar input { padding: 8px 12px; font-size: 12px; border-radius: 12px; }
  .api-bar button { width: auto; height: auto; padding: 8px 14px; border-radius: 12px; font-size: 12px; }
</style>
</head>
<body>

  <div class="header">
    <h1>✨ Reena AI ✨</h1>
    <p>Always here for you ❤️</p>
  </div>
